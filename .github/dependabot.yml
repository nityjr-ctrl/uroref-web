version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      quality-tooling:
        patterns:
          - pagefind
          - promptfoo
          - axe-core
          - '@axe-core/playwright'
          - playwright
      spatial-viewer:
        patterns:
          - '@google/model-viewer'
          - three
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
