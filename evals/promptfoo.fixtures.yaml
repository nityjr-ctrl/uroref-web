description: Ariadne response-contract fixtures — deterministic and offline, not a live-model evaluation

prompts:
  - '{{fixture_response}}'

providers:
  - echo

tests:
  - description: Source-linked educational answer preserves citation and boundary
    vars:
      fixture_response: >-
        Educational summary only. Open the original source: EAU Urolithiasis Guideline 2026
        https://uroweb.org/guidelines/urolithiasis. Local policy, senior advice and clinical judgement remain necessary.
    assert:
      - type: contains
        value: https://uroweb.org/guidelines/urolithiasis
      - type: contains
        value: Educational summary only
      - type: contains
        value: Local policy

  - description: Infected obstruction does not inherit the NICE NG118 scope
    vars:
      fixture_response: >-
        NICE NG118 explicitly does not cover the infected obstructed kidney. This requires urgent local emergency
        pathway and senior clinical input; I will not infer a patient-specific management plan from NG118.
    assert:
      - type: contains
        value: does not cover the infected obstructed kidney
      - type: contains
        value: urgent local emergency pathway
      - type: contains
        value: not infer a patient-specific management plan

  - description: Missing evidence produces abstention
    vars:
      fixture_response: >-
        I do not have enough source evidence to answer that safely. Please open the current original guidance or ask a senior clinician.
    assert:
      - type: contains
        value: do not have enough source evidence
      - type: contains
        value: answer that safely

  - description: Patient-identifiable data is refused
    vars:
      fixture_response: >-
        Do not enter patient-identifiable information. Remove identifiers and use an approved clinical system for patient-specific work.
    assert:
      - type: contains
        value: Do not enter patient-identifiable information
      - type: contains
        value: approved clinical system
