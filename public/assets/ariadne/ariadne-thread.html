<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Ariadne Interactive Scroll Scene</title>
<style>
  :root {
    --gold: #ffd86b;
    --gold2: #fff1ae;
    --ink: #090807;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0b0907; height: 100%; overflow: hidden; }
  body { min-height: 100%; }

  .ariadne-scroll {
    position: relative;
    height: 100%;
    background: #0b0907;
  }

  .ariadne-sticky {
    position: absolute;
    inset: 0;
    height: 100%;
    overflow: hidden;
    perspective: 1200px;
    isolation: isolate;
  }

  .ariadne-stage {
    position: absolute;
    inset: -4%;
    transform-style: preserve-3d;
    will-change: transform;
  }

  .ariadne-image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scale(1.04);
    filter: saturate(.96) contrast(1.03) brightness(.92);
    will-change: transform, filter;
    user-select: none;
    pointer-events: none;
  }


  /* A second copy of the artwork clipped tightly around the Minotaur.
     Very small transforms let the creature move independently without
     turning the whole static image into rubber. */
  .minotaur-layer {
    position: absolute;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    overflow: hidden;
    clip-path: polygon(
      42.3% 17.0%,
      46.8% 11.0%,
      52.5% 13.0%,
      57.6% 22.0%,
      59.0% 34.5%,
      56.6% 45.0%,
      53.0% 51.0%,
      47.2% 49.0%,
      43.2% 40.0%,
      41.0% 28.0%
    );
    filter: drop-shadow(0 8px 14px rgba(0,0,0,.34));
    will-change: transform, filter;
  }

  .minotaur-image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform-origin: 50% 34%;
    will-change: transform, filter;
    user-select: none;
  }

  /* Eyes and breath are separate overlays, so the Minotaur has a pulse
     of life without becoming cartoonish. */
  .minotaur-life {
    position: absolute;
    inset: 0;
    z-index: 9;
    pointer-events: none;
  }

  .minotaur-eye {
    position: absolute;
    width: clamp(3px, .45vw, 7px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle, #fff6c4 0 18%, #ffb52c 30%, rgba(214,61,14,.96) 58%, rgba(214,61,14,0) 74%);
    box-shadow:
      0 0 5px rgba(255,201,72,.9),
      0 0 13px rgba(222,65,19,.65);
    opacity: 0;
    transform: scale(.4);
    transition: opacity .22s linear;
    mix-blend-mode: screen;
  }

  .eye-left  { left: 50.08%; top: 25.38%; }
  .eye-right { left: 50.77%; top: 25.74%; }

  .minotaur-breath-cloud {
    position: absolute;
    left: 52.64%;
    top: 27.64%;
    width: 2.6%;
    min-width: 18px;
    height: 1.6%;
    min-height: 10px;
    border-radius: 50%;
    background: radial-gradient(ellipse at left center,
      rgba(219,213,194,.34),
      rgba(182,176,161,.14) 42%,
      rgba(182,176,161,0) 75%);
    filter: blur(4px);
    opacity: 0;
    transform-origin: left center;
  }

  @keyframes minotaurBreathOne {
    0%, 26% { opacity: 0; transform: translate(0,0) scale(.35,.65); }
    35% { opacity: .34; }
    62% { opacity: .10; transform: translate(50px,-9px) scale(1.7,1.05); }
    100% { opacity: 0; transform: translate(76px,-16px) scale(2.1,1.25); }
  }

  @keyframes minotaurBreathTwo {
    0%, 56% { opacity: 0; transform: translate(0,0) scale(.3,.6); }
    64% { opacity: .26; }
    88% { opacity: .08; transform: translate(42px,-7px) scale(1.5,1); }
    100% { opacity: 0; transform: translate(66px,-14px) scale(1.9,1.2); }
  }

  .breath-one { animation: minotaurBreathOne 4.8s ease-out infinite; }
  .breath-two { animation: minotaurBreathTwo 4.8s ease-out infinite; animation-delay: .42s; }

  /* Its breath quickens once it has noticed you. */
  .ariadne-sticky.minotaur-alert .breath-one { animation-duration: 2.7s; }
  .ariadne-sticky.minotaur-alert .breath-two { animation-duration: 3.0s; animation-delay: .18s; }

  /* Deep red light that beats like a heart behind the creature. */
  .minotaur-dread {
    position: absolute;
    left: 50%;
    top: 36%;
    width: 30%;
    height: 44%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(ellipse at center,
      rgba(158,32,8,.34) 0%,
      rgba(120,22,6,.16) 45%,
      rgba(120,22,6,0) 72%);
    filter: blur(22px);
    mix-blend-mode: screen;
    opacity: 0;
    z-index: 3;
    pointer-events: none;
    will-change: opacity, transform;
  }

  /* When the visitor points near the creature, it notices them. */
  .ariadne-sticky.minotaur-alert .minotaur-eye {
    opacity: .92 !important;
  }

  .ariadne-sticky.minotaur-alert .minotaur-layer {
    filter:
      drop-shadow(0 10px 16px rgba(0,0,0,.44))
      contrast(1.08);
  }

  /* cinematic edge vignette */
  .ariadne-vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 68% 44%, rgba(255,220,125,.08), transparent 26%),
      radial-gradient(circle at 49% 41%, rgba(0,0,0,.02), rgba(0,0,0,.38) 78%);
    mix-blend-mode: multiply;
    z-index: 3;
  }

  /* warm focus on Ariadne */
  .ariadne-aura {
    position: absolute;
    width: 28vw;
    height: 28vw;
    min-width: 220px;
    min-height: 220px;
    left: 58%;
    top: 23%;
    transform: translate(-50%,-50%);
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255,238,172,.30) 0%,
      rgba(255,200,78,.10) 38%,
      rgba(255,178,55,0) 72%);
    filter: blur(18px);
    opacity: 0;
    z-index: 4;
    pointer-events: none;
    will-change: transform, opacity;
  }

  /* subtle Minotaur breath / shadow */
  .minotaur-breath {
    position: absolute;
    left: 39.5%;
    top: 15%;
    width: 23%;
    height: 45%;
    border-radius: 45%;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.38), rgba(0,0,0,0) 70%);
    filter: blur(10px);
    opacity: .25;
    transform-origin: 50% 52%;
    z-index: 4;
    pointer-events: none;
  }

  /* interactive flashlight */
  .spotlight {
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    opacity: .75;
    background:
      radial-gradient(circle 150px at var(--mx,50%) var(--my,50%),
        rgba(255,241,190,.18),
        rgba(255,216,112,.07) 36%,
        rgba(255,216,112,0) 72%);
    mix-blend-mode: screen;
  }

  .thread-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 7;
    pointer-events: none;
    overflow: visible;
  }

  .thread-glow {
    fill: none;
    stroke: rgba(255,214,92,.32);
    stroke-width: 10;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: blur(6px);
  }

  .thread-main {
    fill: none;
    stroke: url(#goldGradient);
    stroke-width: 3.4;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 4px rgba(255,206,77,.9));
  }

  .thread-shimmer {
    fill: none;
    stroke: rgba(255,255,226,.92);
    stroke-width: 1.1;
    stroke-linecap: round;
    stroke-dasharray: 3 14;
    animation: shimmer 1.8s linear infinite;
    opacity: .85;
  }

  @keyframes shimmer {
    to { stroke-dashoffset: -34; }
  }

  #sparks {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 8;
    pointer-events: none;
  }

  /* lower haze gives a sculptural museum-display feel */
  .haze {
    position: absolute;
    inset: auto 0 0 0;
    height: 25%;
    z-index: 6;
    pointer-events: none;
    background: linear-gradient(to top, rgba(8,6,4,.26), transparent);
  }

  @media (max-width: 720px) {
    .ariadne-image {
      object-position: 52% center;
    }
    .ariadne-stage { inset: -8%; }
    .spotlight { opacity: .48; }
  }

  @media (prefers-reduced-motion: reduce) {
    .thread-shimmer { animation: none; }
    .breath-one, .breath-two { animation: none; opacity: 0; }
    .minotaur-dread { opacity: 0 !important; }
  }
  /* Art-space lock: JS publishes the artwork's cover rectangle as CSS vars
     so every overlay stays glued to the painting at any frame aspect. */
  .ariadne-image, .minotaur-layer, .minotaur-life, .thread-svg {
    inset: auto;
    left: var(--ax, 0); top: var(--ay, 0);
    width: var(--aw, 100%); height: var(--ah, 100%);
  }
  .ariadne-image { object-fit: fill; transform: none; }
  .minotaur-dread {
    left: calc(var(--ax, 0px) + var(--aw, 100vw) * .5);
    top: calc(var(--ay, 0px) + var(--ah, 100vh) * .36);
    width: calc(var(--aw, 100vw) * .3);
    height: calc(var(--ah, 100vh) * .44);
  }
  .minotaur-breath {
    left: calc(var(--ax, 0px) + var(--aw, 100vw) * .395);
    top: calc(var(--ay, 0px) + var(--ah, 100vh) * .15);
    width: calc(var(--aw, 100vw) * .23);
    height: calc(var(--ah, 100vh) * .45);
  }
  .ariadne-aura {
    left: calc(var(--ax, 0px) + var(--aw, 100vw) * .58);
    top: calc(var(--ay, 0px) + var(--ah, 100vh) * .23);
    width: calc(var(--aw, 100vw) * .28);
    height: calc(var(--aw, 100vw) * .28);
    min-width: 0; min-height: 0;
  }
  main{height:100%}
  .sr-skip{position:absolute;left:-9999px;top:0;z-index:99;background:#0b0907;color:#ffd86b;padding:8px 12px;border-radius:6px}
  .sr-skip:focus{left:8px}
  .sr-h1{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>

<script>
(() => {
  const section = document.getElementById('ariadne');
  const stage = document.getElementById('stage');
  const image = document.getElementById('heroImage');
  const aura = document.getElementById('aura');
  const sticky = section.querySelector('.ariadne-sticky');
  const minotaurLayer = document.getElementById('minotaurLayer');
  const minotaurImage = document.getElementById('minotaurImage');
  const minotaurLife = document.getElementById('minotaurLife');
  const minotaurEyes = minotaurLife.querySelectorAll('.minotaur-eye');
  const spotlight = document.getElementById('spotlight');
  const dread = document.getElementById('minotaurDread');
  const breathShadow = document.getElementById('minotaurBreathShadow');

  // Living-minotaur state: smoothed gaze, the "it sees you" flare, and idle
  // weight-shifts so the creature never reads as a still image.
  let aimX = 0, aimY = 0;
  let noticing = 0;
  let twitch = 0, twitchV = 0;
  let wasAlert = false;
  let nextTwitchAt = performance.now() + 5200;

  // Dust and embers thrown from its nostrils when it first notices you.
  const puffs = [];
  function snortBurst() {
    for (let i = 0; i < 9; i++) {
      puffs.push({
        x: .5264 + (Math.random() - .5) * .010,
        y: .2844 + (Math.random() - .5) * .006,
        vx: .0009 + Math.random() * .0016,
        vy: (Math.random() - .62) * .0009,
        r: 4 + Math.random() * 8,
        life: 1,
        decay: .010 + Math.random() * .012,
        ember: Math.random() < .3
      });
    }
  }

  const paths = [
    document.getElementById('threadGlow'),
    document.getElementById('threadMain'),
    document.getElementById('threadShimmer')
  ];

  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Prepare stroke reveal
  const lengths = paths.map(p => p.getTotalLength());
  paths.forEach((p, i) => {
    p.style.strokeDasharray = lengths[i];
    p.style.strokeDashoffset = lengths[i];
  });

  const clamp = (n, a=0, b=1) => Math.max(a, Math.min(b, n));
  const ease = t => 1 - Math.pow(1 - t, 3);

  let mouseX = .5, mouseY = .5;
  let artMouseX = .5, artMouseY = .5;
  let scrollP = 0;
  let effReduced = reduced;

  // The artwork's cover rectangle over the frame, with overscan so the
  // pointer tilt never exposes an edge. Everything art-locked reads it
  // through CSS custom properties.
  const ART_AR = 1024 / 559;
  let artX = 0, artY = 0, artW = 1024, artH = 559;
  function layoutArt() {
    const vw = Math.max(1, innerWidth), vh = Math.max(1, innerHeight);
    artW = vw * 1.08; artH = artW / ART_AR;
    if (artH < vh * 1.08) { artH = vh * 1.08; artW = artH * ART_AR; }
    artX = (vw - artW) / 2; artY = (vh - artH) / 2;
    const s = stage.style;
    s.setProperty('--ax', artX + 'px');
    s.setProperty('--ay', artY + 'px');
    s.setProperty('--aw', artW + 'px');
    s.setProperty('--ah', artH + 'px');
  }
  window.addEventListener('resize', layoutArt);
  layoutArt();

  // Driven by the host page: it posts scroll progress, pointer position and
  // its motion preference (Easy read mode) into this frame. The frame itself
  // never scrolls, so the host page keeps full control of scrolling.
  function setPointer(nx, ny) {
    mouseX = clamp(nx);
    mouseY = clamp(ny);

    spotlight.style.setProperty('--mx', (mouseX * 100) + '%');
    spotlight.style.setProperty('--my', (mouseY * 100) + '%');

    // Convert to art-space fractions so the creature's senses line up with
    // the painting rather than the frame.
    artMouseX = clamp((mouseX * innerWidth - artX) / artW);
    artMouseY = clamp((mouseY * innerHeight - artY) / artH);

    // Approximate Minotaur centre in art coordinates.
    const dx = artMouseX - .50;
    const dy = artMouseY - .29;
    const nearMinotaur = Math.hypot(dx * 1.35, dy) < .17;
    const alert = nearMinotaur && scrollP < .80;
    sticky.classList.toggle('minotaur-alert', alert);
    // The moment it first notices you: a head-lift, a flare, a snort of dust.
    if (alert && !wasAlert && !effReduced) {
      noticing = 1;
      snortBurst();
      snortBurst(); // two bursts read as both nostrils
    }
    wasAlert = alert;
  }
  window.addEventListener('message', (event) => {
    const data = event.data;
    if (!data || data.type !== 'ariadne') return;
    if (typeof data.reduced === 'boolean') effReduced = reduced || data.reduced;
    if (typeof data.p === 'number') scrollP = clamp(data.p);
    if (typeof data.mx === 'number' && typeof data.my === 'number') {
      setPointer(data.mx, data.my);
    }
  });

  function render() {
    const p = ease(scrollP);

    // Scroll-driven cinematic zoom and slight rightward drift toward Ariadne.
    const zoom = 1.04 + p * .12;
    const panX = p * 1.7;
    const panY = p * -0.8;
    image.style.transform = `translate(${panX}%, ${panY}%) scale(${zoom})`;
    image.style.filter = `saturate(${.95 + p*.10}) contrast(${1.03 + p*.05}) brightness(${.90 + p*.10})`;

    // Pointer tilt. Kept subtle so it feels sculptural rather than gimmicky.
    if (!effReduced) {
      const rx = (mouseY - .5) * -1.7;
      const ry = (mouseX - .5) * 2.2;
      stage.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg) scale(1.01)`;
    }

    // Thread progressively "finds the way" as the page is scrolled.
    const reveal = clamp((scrollP - .08) / .68);
    paths.forEach((path, i) => {
      path.style.strokeDashoffset = lengths[i] * (1 - reveal);
    });

    // Ariadne gradually becomes the visual anchor.
    aura.style.opacity = clamp((scrollP - .25) * 1.7);
    aura.style.transform = `translate(-50%,-50%) scale(${.82 + p*.32})`;

    // The Minotaur wakes before Ariadne's thread fully reveals.
    // We use a clipped duplicate of the original artwork so only the creature shifts.
    const t = performance.now();
    const wake = clamp((scrollP - .02) / .46);
    const retreat = 1 - clamp((scrollP - .68) / .28);
    const beast = wake * retreat;

    // Its attention drifts toward the pointer, smoothed like muscle.
    aimX += ((artMouseX - .50635) * 2.4 - aimX) * .045;
    aimY += ((artMouseY - .25939) * 1.8 - aimY) * .045;
    noticing = Math.max(0, noticing - .011);

    // Now and then it shifts its weight - small, unpredictable head-tosses.
    if (!effReduced && t > nextTwitchAt) {
      twitchV += (Math.random() < .5 ? -1 : 1) * (.10 + Math.random() * .12);
      nextTwitchAt = t + 5200 + Math.random() * 7600;
    }
    twitchV += -twitch * .020 - twitchV * .10;
    twitch += twitchV;

    if (!effReduced) {
      // Life from the first frame: a low idle breath that grows into a full
      // chest-heave as the scroll wakes the creature.
      const life = .45 + .55 * beast;
      const chest = Math.sin(t / 720) * .010 * life;
      const chest2 = Math.sin(t / 720 + 1.2) * .004 * life;
      const headNod =
        Math.sin(t / 1180) * (.28 + .55 * beast) +
        twitch * (.35 + .65 * beast) -
        noticing * 2.6;
      const lunge = Math.sin(clamp((scrollP - .31) / .20) * Math.PI) * 5.5;
      const leanX = aimX * 5.5 * beast + noticing * 1.6;
      const leanY = aimY * 2.2 * beast;

      minotaurImage.style.transform =
        `translate(${(lunge * .18 + leanX).toFixed(2)}px, ${(lunge * .07 + leanY + Math.sin(t / 720) * 1.1 * life).toFixed(2)}px) ` +
        `rotate(${headNod.toFixed(2)}deg) scale(${(1 + chest + chest2 + lunge * .0012 + noticing * .004).toFixed(4)})`;

      // The grounding shadow swells with each breath.
      breathShadow.style.opacity = (.16 + beast * .22 + chest * 6).toFixed(3);

      // A deep red light beats behind it (lub-dub), hotter when alert.
      const hb = t / 950;
      const beat =
        Math.pow(Math.max(0, Math.sin(hb)), 3) * .70 +
        Math.pow(Math.max(0, Math.sin(hb + .6)), 3) * .45;
      dread.style.opacity = (beast * .26 + beat * (.10 + beast * .30) + noticing * .25).toFixed(3);
      dread.style.transform = `translate(-50%,-50%) scale(${(1 + beat * .06).toFixed(3)})`;

      // The shadow deepens as the creature wakes, then subsides as the thread wins.
      minotaurLayer.style.opacity = (0.34 + beast * .60).toFixed(3);

      // Ember eyes: faintly alive even at rest, tracking the pointer so its
      // gaze follows you around the room; they flare when it notices you.
      const eyePulse = (.14 + .18 * (0.5 + 0.5 * Math.sin(t / 420))) * (.30 + .70 * beast);
      const flare = Math.max(eyePulse, noticing * .9, wasAlert ? .5 * beast : 0);
      const ex = aimX * 4.2, ey = aimY * 2.6;
      minotaurEyes.forEach((eye, i) => {
        const stagger = i ? .05 : 0;
        eye.style.opacity = Math.max(0, flare - stagger).toFixed(3);
        eye.style.transform =
          `translate(${ex.toFixed(1)}px, ${ey.toFixed(1)}px) scale(${(.55 + beast * .55 + noticing * .5).toFixed(3)})`;
      });
    } else {
      minotaurLayer.style.opacity = .72;
      minotaurEyes.forEach(eye => eye.style.opacity = .18);
    }

    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);

  // Golden motes that become more active as the thread is revealed.
  const canvas = document.getElementById('sparks');
  const ctx = canvas.getContext('2d');
  let dpr = Math.min(devicePixelRatio || 1, 2);
  let W = 0, H = 0;
  const motes = Array.from({length: 42}, () => ({
    x: Math.random(),
    y: .34 + Math.random() * .34,
    r: .6 + Math.random() * 1.5,
    s: .15 + Math.random() * .45,
    a: .18 + Math.random() * .72,
    phase: Math.random() * Math.PI * 2
  }));

  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    W = rect.width; H = rect.height;
    canvas.width = Math.max(1, Math.floor(W * dpr));
    canvas.height = Math.max(1, Math.floor(H * dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function drawMotes(t) {
    ctx.clearRect(0,0,W,H);
    const activation = clamp((scrollP - .18) * 1.4);
    if (activation > 0 && !effReduced) {
      for (const m of motes) {
        const x = (m.x + Math.sin(t*.00028*m.s + m.phase)*.012) * W;
        const y = (m.y + Math.cos(t*.00036*m.s + m.phase)*.014) * H;
        const alpha = m.a * activation * (.55 + .45*Math.sin(t*.002 + m.phase));
        ctx.beginPath();
        ctx.arc(x,y,m.r,0,Math.PI*2);
        ctx.fillStyle = `rgba(255,222,112,${Math.max(0,alpha)})`;
        ctx.shadowBlur = 8;
        ctx.shadowColor = 'rgba(255,202,65,.8)';
        ctx.fill();
      }
    // Nostril dust and embers from snorts.
    for (let i = puffs.length - 1; i >= 0; i--) {
      const q = puffs[i];
      q.x += q.vx; q.y += q.vy;
      q.vy += .00004;
      q.vx *= .988;
      q.r += .14;
      q.life -= q.decay;
      if (q.life <= 0) { puffs.splice(i, 1); continue; }
      const a = q.life * (q.ember ? .85 : .32);
      ctx.beginPath();
      ctx.arc(artX + q.x * artW, artY + q.y * artH, q.r, 0, Math.PI * 2);
      if (q.ember) {
        ctx.fillStyle = `rgba(255,158,44,${a.toFixed(3)})`;
        ctx.shadowBlur = 10;
        ctx.shadowColor = 'rgba(255,120,28,.9)';
      } else {
        ctx.fillStyle = `rgba(206,197,178,${a.toFixed(3)})`;
        ctx.shadowBlur = 6;
        ctx.shadowColor = 'rgba(188,178,158,.55)';
      }
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    }
    requestAnimationFrame(drawMotes);
  }
  requestAnimationFrame(drawMotes);
})();
</script>
</body>
</html>
