  <circle cx="128" cy="139" r="50" fill="#0A2138" stroke="#C8E5FF" stroke-width="7"/>
  <circle cx="128" cy="139" r="34" fill="url(#lens)"/>
  <circle cx="116" cy="127" r="9" fill="#FFFFFF" opacity=".75"/>
  <path d="M128 94v13M128 171v13M83 139h13M160 139h13" stroke="#8FC7FF" stroke-width="4" stroke-linecap="round" opacity=".72"/>
  <circle cx="103" cy="173" r="6" fill="#67FFF2" filter="url(#glow)"/>
  <circle cx="153" cy="173" r="6" fill="#67FFF2" filter="url(#glow)"/>
</svg>
