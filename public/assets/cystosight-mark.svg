<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Cystosight by UroRef mark</title>
  <desc id="desc">A bladder-shaped field of view with a focused cystoscopy lens.</desc>
  <defs>
    <linearGradient id="bg" x1="24" y1="16" x2="228" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#183C61"/>
      <stop offset="1" stop-color="#061725"/>
    </linearGradient>
    <radialGradient id="lens" cx="38%" cy="34%" r="70%">
      <stop stop-color="#EAF7FF"/>
      <stop offset=".38" stop-color="#8FC7FF"/>
      <stop offset="1" stop-color="#357FC2"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="4" y="4" width="248" height="248" rx="58" fill="url(#bg)"/>
  <rect x="4.5" y="4.5" width="247" height="247" rx="57.5" fill="none" stroke="#FFFFFF" stroke-opacity=".10"/>
