<!doctype html>
<html lang="en">
<head>
    <meta name="robots" content="noindex">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pv-case-008 AR model-viewer check</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #030809; color: #eef8f6; font-family: Inter, system-ui, sans-serif; }
    model-viewer { width: 100%; height: 100%; background: radial-gradient(circle at 50% 35%, rgba(118,230,232,.16), transparent 46%), #030809; }
    .badge { position: fixed; left: 16px; top: 16px; padding: 10px 12px; border: 1px solid rgba(192,245,238,.24); border-radius: 8px; background: rgba(5,13,15,.82); }
    .palette { position: fixed; left: 16px; right: 16px; bottom: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 6px; border: 1px solid rgba(192,245,238,.2); border-radius: 12px; background: rgba(5,13,15,.72); backdrop-filter: blur(10px); }
    .palette button { border: 0; border-radius: 8px; min-height: 44px; color: #d9f1ef; background: rgba(214,238,236,.12); font: 700 14px Inter, system-ui, sans-serif; }
    .palette button.active { color: #061012; background: #dcefed; }
  </style>
</head>
<body>
  <div class="badge">pv-case-008 - human palette, apex/front default, A/B/L/R markers baked</div>
  <model-viewer
    id="viewer"
    src="./model.glb"
    ios-src="./model.usdz"
    camera-controls
    touch-action="pan-y"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="fixed"
    ar-placement="floor"
    shadow-intensity="0.45"
    exposure="1.05"
    alt="Optimised ProstateView AR model with A/B/L/R orientation markers">
  </model-viewer>
  <div class="palette" aria-label="Palette">
    <button class="active" type="button" data-root="models_ar_human" data-label="Human">Human</button>
    <button type="button" data-root="models_ar" data-label="Teal">Teal</button>
  </div>
  <script>
    const viewer = document.querySelector("#viewer");
    const badge = document.querySelector(".badge");
    const buttons = [...document.querySelectorAll(".palette button")];
    buttons.forEach((button) => {
      button.addEventListener("click", () => {
        buttons.forEach((item) => item.classList.toggle("active", item === button));
        const root = button.dataset.root;
        const label = button.dataset.label;
        const base = root === "models_ar_human" ? "." : `../../${root}/pv-case-008`;
        viewer.setAttribute("src", `${base}/model.glb`);
        viewer.setAttribute("ios-src", `${base}/model.usdz`);
        badge.textContent = `pv-case-008 - ${label.toLowerCase()} palette, apex/front default, A/B/L/R markers baked`;
      });
    });
  </script>
</body>
</html>
